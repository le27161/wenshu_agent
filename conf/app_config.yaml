logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,13308}
  user: ${oc.env:MYSQL_USER,appuser}
  password: ${oc.env:MYSQL_PASSWORD,change_me}
  database: ${oc.env:MYSQL_META_DATABASE,meta}

db_dw:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,13308}
  user: ${oc.env:MYSQL_USER,appuser}
  password: ${oc.env:MYSQL_PASSWORD,change_me}
  database: ${oc.env:MYSQL_DW_DATABASE,dw}

db_olist:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,13308}
  user: ${oc.env:MYSQL_USER,appuser}
  password: ${oc.env:MYSQL_PASSWORD,change_me}
  database: ${oc.env:MYSQL_OLIST_DATABASE,olist}

qdrant:
  host: ${oc.env:QDRANT_HOST,localhost}
  port: ${oc.env:QDRANT_PORT,6333}
  embedding_size: ${oc.env:QDRANT_EMBEDDING_SIZE,1024}

embedding:
  host: ${oc.env:EMBEDDING_HOST,localhost}
  port: ${oc.env:EMBEDDING_PORT,8081}
  model: ${oc.env:EMBEDDING_MODEL,BAAI/bge-large-zh-v1.5}

es:
  host: ${oc.env:ELASTICSEARCH_HOST,localhost}
  port: ${oc.env:ELASTICSEARCH_PORT,9200}
  index_name: ${oc.env:ELASTICSEARCH_INDEX,data_agent}

llm:
  model_name: ${oc.env:LLM_MODEL,qwen-plus}
  api_key: ${oc.env:LLM_API_KEY}
  base_url: ${oc.env:LLM_BASE_URL,https://dashscope.aliyuncs.com/compatible-mode/v1}
